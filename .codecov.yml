coverage:
  precision: 2
  round: down
  range: "70...100"

flags:
  desktop:
    paths:
      - desktop-app/
    carryforward: true
  web:
    paths:
      - web-app/
    carryforward: true

status:
  project:
    default:
      target: auto
      threshold: 1%
  patch:
    default:
      target: auto
      threshold: 1%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
