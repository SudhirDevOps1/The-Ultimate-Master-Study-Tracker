version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/desktop-app"
    schedule:
      interval: "monthly"
      day: "first sunday"
    open-pull-requests-limit: 2
    groups:
      all-desktop-dependencies:
        patterns:
          - "*"
    ignore:
      # Block breaking major bumps for core bundler & framework
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web-app"
    schedule:
      interval: "monthly"
      day: "first sunday"
    open-pull-requests-limit: 2
    groups:
      all-web-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first sunday"
    open-pull-requests-limit: 2
    groups:
      all-github-actions:
        patterns:
          - "*"
