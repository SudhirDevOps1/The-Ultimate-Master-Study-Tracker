name: Lossless Image Optimizer

on:
  schedule:
    - cron: "0 0 1 * *" # Monthly on the 1st at 00:00 UTC
  push:
    paths:
      - "public/images/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.svg"
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  optimize:
    name: Lossless Asset Compression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compress Images
        uses: calibreapp/image-actions@83b129706d9c6e49e6013dc3617c78cbbc3de5a5 # main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          ignorePaths: "node_modules/**,dist/**,dist-electron/**"
