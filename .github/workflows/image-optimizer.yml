name: Lossless Image Optimizer

on:
  schedule:
    - cron: "30 5 */2 * *" # Every 2 days at 05:30 UTC
  push:
    paths:
      - "public/images/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.svg"
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  optimize:
    name: Lossless Asset Compression
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compress Images
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          ignorePaths: "node_modules/**,dist/**,dist-electron/**"
