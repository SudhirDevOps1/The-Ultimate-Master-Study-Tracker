name: Tier 4 - Automated Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  quality-gate:
    name: Pre-Release Quality Verification
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Typecheck Validation
        run: |
          cd desktop-app
          npm run typecheck || true

      - name: Lint Inspection
        run: |
          cd desktop-app
          npm run lint

      - name: Unit Tests
        run: |
          cd desktop-app
          npm run test

      - name: Build Check
        run: |
          cd desktop-app
          npm run build

  release-please:
    name: Run Release Please Engine
    needs: quality-gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
