name: Release & Quality Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  quality_gate:
    name: 🛡️ Pre-Release Quality Gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Typecheck
        run: |
          cd desktop-app
          npm run typecheck --if-present

      - name: Lint
        run: |
          cd desktop-app
          npm run lint --if-present

      - name: Run Tests
        run: |
          cd desktop-app
          npm run test --if-present

      - name: Build Verification
        run: |
          cd desktop-app
          npm run build --if-present

  release_please:
    name: 🚀 Google Release Please
    needs: quality_gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4.1.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build_desktop_artifacts:
    name: 📦 Build Desktop (${{ matrix.os }})
    needs: release_please
    if: needs.release_please.outputs.releases_created == 'true' || needs.release_please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Sync Desktop Version with Release Tag
        shell: bash
        run: |
          TAG="${{ needs.release_please.outputs.tag_name }}"
          CLEAN_VER="${TAG#v}"
          echo "Syncing desktop-app version to $CLEAN_VER"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('desktop-app/package.json', 'utf8'));
            pkg.version = '$CLEAN_VER';
            fs.writeFileSync('desktop-app/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Web Application
        run: |
          cd desktop-app
          npm run build

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd desktop-app
          npx electron-builder --win --publish never

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd desktop-app
          npx electron-builder --linux AppImage deb --publish never

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd desktop-app
          npx electron-builder --mac zip dmg --publish never

      - name: Upload Binaries directly to GitHub Release
        shell: bash
        run: |
          TAG="${{ needs.release_please.outputs.tag_name }}"
          echo "Uploading ${{ matrix.os }} release artifacts to $TAG..."
          shopt -s nullglob
          files=(desktop-app/dist-electron/*.exe desktop-app/dist-electron/*.AppImage desktop-app/dist-electron/*.deb desktop-app/dist-electron/*.zip desktop-app/dist-electron/*.dmg desktop-app/dist-electron/latest*.yml)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "No matching release binaries found in desktop-app/dist-electron"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  enrich_release_notes:
    name: 👥 Add Contributor Wall to Release
    needs: [release_please, build_desktop_artifacts]
    if: always() && (needs.release_please.outputs.releases_created == 'true' || needs.release_please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Append Contributor Recognition
        shell: bash
        run: |
          TAG="${{ needs.release_please.outputs.tag_name }}"
          echo "Appending contributor recognition to release $TAG..."
          CURRENT_NOTES=$(gh release view "$TAG" --json body -q .body)
          if [[ "$CURRENT_NOTES" != *"Contributors & Release Recognition"* ]]; then
            CONTRIBUTORS_WALL="

---

### 👥 Contributors & Release Recognition
Heartfelt thanks to everyone contributing code, reviews, and bug reports to make FlowTrack Pro the ultimate study workstation!

| Contributor | GitHub Profile | Role |
| :---: | :--- | :--- |
| <img src=\"https://avatars.githubusercontent.com/u/234449571?v=4\" width=\"44\" height=\"44\" style=\"border-radius:50%\" alt=\"SudhirDevOps1\" /> | **[@SudhirDevOps1](https://github.com/SudhirDevOps1)** | Lead Architect & Maintainer |

<p align=\"left\">
  <a href=\"https://github.com/SudhirDevOps1/The-Ultimate-Master-Study-Tracker/graphs/contributors\">
    <img src=\"https://contrib.rocks/image?repo=SudhirDevOps1/The-Ultimate-Master-Study-Tracker\" alt=\"Contributors Avatar Wall\" />
  </a>
</p>
"
            gh release edit "$TAG" --notes "$CURRENT_NOTES$CONTRIBUTORS_WALL"
            echo "Release notes enriched with Contributor Wall successfully!"
          else
            echo "Release $TAG already contains contributor wall."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
