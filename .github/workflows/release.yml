name: Release & Quality Gate

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quality_gate:
    name: 🛡️ Pre-Release Quality Gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Typecheck
        run: |
          cd desktop-app
          npm run typecheck --if-present

      - name: Lint
        run: |
          cd desktop-app
          npm run lint --if-present

      - name: Run Tests
        run: |
          cd desktop-app
          npm run test --if-present

      - name: Build Verification
        run: |
          cd desktop-app
          npm run build --if-present

  release_please:
    name: 🚀 Google Release Please
    needs: quality_gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build_desktop_artifacts:
    name: 📦 Build & Publish Desktop Binaries
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' || needs.release_please.outputs.release_created == true }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Sync Desktop Version with Release Tag
        shell: bash
        run: |
          TAG="${{ needs.release_please.outputs.tag_name }}"
          CLEAN_VER="${TAG#v}"
          echo "Syncing desktop-app version to $CLEAN_VER"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('desktop-app/package.json', 'utf8'));
            pkg.version = '$CLEAN_VER';
            fs.writeFileSync('desktop-app/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build and Publish Electron Binaries
        shell: bash
        run: |
          cd desktop-app
          npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer directly to GitHub Release
        shell: bash
        run: |
          TAG="${{ needs.release_please.outputs.tag_name }}"
          echo "Uploading release artifacts to $TAG..."
          if ls desktop-app/dist-electron/*.exe 1> /dev/null 2>&1; then
            gh release upload "$TAG" desktop-app/dist-electron/*.exe --clobber
          elif ls desktop-app/dist/*.exe 1> /dev/null 2>&1; then
            gh release upload "$TAG" desktop-app/dist/*.exe --clobber
          else
            echo "Searching for any built exe in desktop-app..."
            find desktop-app -name "*.exe" -exec gh release upload "$TAG" {} --clobber + || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
