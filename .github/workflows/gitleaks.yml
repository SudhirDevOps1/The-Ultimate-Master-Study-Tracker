name: Gitleaks Secret Scanner

on:
  schedule:
    - cron: "30 3 */2 * *" # Every 2 days at 03:30 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Detect Hardcoded Secrets
    runs-on: ubuntu-latest
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
