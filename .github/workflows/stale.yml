name: Stale Issues & PRs Manager

on:
  schedule:
    - cron: "0 5 */2 * *" # Every 2 days at 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs. Thank you for your contributions to FlowTrack Pro!"
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-pr-labels: "autorelease: pending, dependencies, enhancement, security, pinned"
          exempt-issue-labels: "pinned, security, feature"
