name: Tier 1 - Fast Quality Gate & Desktop CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.ai/**'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  fast-quality-gate:
    name: Fast Quality Gate (Typecheck, Lint & Unit Test)
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'desktop-app/package-lock.json'

    - name: Verify release version consistency
      run: node scripts/check-release-versions.mjs

    - name: Install Desktop App Dependencies
      run: |
        cd desktop-app
        npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000

    - name: Run TypeScript Compiler Check
      run: |
        cd desktop-app
        npm run typecheck

    - name: Run Linter Inspection
      run: |
        cd desktop-app
        npm run lint

    - name: Run Python Backend Syntax & Lint Check
      run: |
        python3 -m py_compile web-app/backend.py
        pip install ruff --quiet
        ruff check web-app/backend.py --exit-zero

    - name: Run Automated Unit Tests
      run: |
        cd desktop-app
        npm run test

    - name: Run E2E Integration Tests
      run: |
        cd desktop-app
        npm run test:e2e

    - name: Build Web Application Bundle
      run: |
        cd desktop-app
        npm run build

  build-desktop-releases:
    name: Build Desktop Apps (${{ matrix.os }})
    needs: fast-quality-gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'desktop-app/package-lock.json'

    - name: Setup Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.11'

    - name: Install Desktop App Dependencies
      run: |
        cd desktop-app
        npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000

    - name: Build Web Assets (Renderer)
      run: |
        cd desktop-app
        npm run build

    - name: Compile Windows C# Active Window Tracker (win-tracker.exe)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        if (Test-Path $cscPath) {
          & $cscPath /target:winexe /out:desktop-app/win-tracker.exe desktop-app/win-tracker.cs
        } else {
          Write-Host "CSC compiler not found; skipping compilation"
        }

    - name: Package Desktop Executable (Electron Builder)
      run: |
        cd desktop-app
        npx electron-builder --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEBUG: electron-builder
        CSC_IDENTITY_AUTO_DISCOVERY: false
        WIN_CSC_LINK: ""
        WIN_CSC_KEY_PASSWORD: ""

    - name: Upload Packaged Artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: FlowTrackPro-${{ matrix.os }}-Installer
        path: |
          desktop-app/dist-electron/*.exe
          desktop-app/dist-electron/*.AppImage
          desktop-app/dist-electron/*.deb
          desktop-app/dist-electron/*.dmg
          desktop-app/dist-electron/*.zip
          desktop-app/dist-electron/*.blockmap
          desktop-app/dist-electron/latest*.yml
        if-no-files-found: warn
        retention-days: 7
