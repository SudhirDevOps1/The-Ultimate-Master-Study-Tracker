name: Tier 1 - Fast Quality Gate & Desktop CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.ai/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.ai/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  fast-quality-gate:
    name: Fast Quality Gate (Typecheck, Lint & Unit Test)
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'desktop-app/package-lock.json'

    - name: Install Desktop App Dependencies
      run: |
        cd desktop-app
        npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000

    - name: Run TypeScript Compiler Check
      run: |
        cd desktop-app
        npm run typecheck

    - name: Run Linter Inspection
      run: |
        cd desktop-app
        npm run lint

    - name: Run Python Backend Syntax & Lint Check
      run: |
        python3 -m py_compile web-app/backend.py
        pip install ruff --quiet
        ruff check web-app/backend.py --exit-zero

    - name: Run Automated Unit Tests
      run: |
        cd desktop-app
        npm run test

    - name: Build Web Application Bundle
      run: |
        cd desktop-app
        npm run build

  build-desktop-releases:
    name: Build Desktop Apps (${{ matrix.os }})
    needs: fast-quality-gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'desktop-app/package-lock.json'

    - name: Cache Electron Binaries
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: ${{ runner.os }}-electron-cache-${{ hashFiles('desktop-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-cache-

    - name: Install Desktop Dependencies
      run: |
        cd desktop-app
        npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000

    - name: Build Web Application
      run: |
        cd desktop-app
        npm run build

    - name: Build Electron App (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd desktop-app
        npx electron-builder --win --publish never

    - name: Build Electron App (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd desktop-app
        npx electron-builder --linux AppImage deb --publish never

    - name: Build Electron App (macOS)
      if: matrix.os == 'macos-latest'
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: |
        cd desktop-app
        npx electron-builder --mac zip dmg --publish never

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: flowtrack-${{ matrix.os }}
        path: desktop-app/dist-electron/
        retention-days: 7
        if-no-files-found: warn
