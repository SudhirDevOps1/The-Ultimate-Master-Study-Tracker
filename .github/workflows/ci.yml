name: Tier 1 - Fast Quality Gate & Desktop CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.ai/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.ai/**'

permissions:
  contents: write

jobs:
  fast-quality-gate:
    name: Fast Quality Gate (Typecheck, Lint & Unit Test)
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'desktop-app/package-lock.json'

    - name: Install Desktop App Dependencies
      run: |
        cd desktop-app
        npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000

    - name: Run TypeScript Compiler Check
      run: |
        cd desktop-app
        npm run typecheck || true

    - name: Run Linter Inspection
      run: |
        cd desktop-app
        npm run lint

    - name: Run Automated Unit Tests
      run: |
        cd desktop-app
        npm run test

    - name: Build Web Application Bundle
      run: |
        cd desktop-app
        npm run build

  build-desktop-releases:
    name: Build Desktop Apps (${{ matrix.os }})
    needs: fast-quality-gate
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'desktop-app/package-lock.json'

    - name: Cache Electron Binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: ${{ runner.os }}-electron-cache-${{ hashFiles('desktop-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-cache-

    - name: Install Desktop Dependencies
      run: |
        cd desktop-app
        npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-mintimeout=20000

    - name: Build Web Application
      run: |
        cd desktop-app
        npm run build

    - name: Build Electron App (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd desktop-app
        npx electron-builder --win --publish never

    - name: Build Electron App (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd desktop-app
        npx electron-builder --linux AppImage deb --publish never

    - name: Build Electron App (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cd desktop-app
        npx electron-builder --mac zip --publish never

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: flowtrack-${{ matrix.os }}
        path: desktop-app/dist-electron/
        if-no-files-found: warn

  publish-github-release:
    name: Publish Release to GitHub
    needs: build-desktop-releases
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Windows Build Artifacts
      uses: actions/download-artifact@v8
      with:
        name: flowtrack-windows-latest
        path: ./artifacts/windows

    - name: Download Linux Build Artifacts
      uses: actions/download-artifact@v8
      with:
        name: flowtrack-ubuntu-latest
        path: ./artifacts/linux

    - name: Download macOS Build Artifacts
      uses: actions/download-artifact@v8
      with:
        name: flowtrack-macos-latest
        path: ./artifacts/macos

    - name: Organize Release Binaries
      run: |
        mkdir -p ./release
        find ./artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} ./release/ \;
        ls -lh ./release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
