name: Tier 2 - Heavy PR Gate & DAST Scan

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop-app/src/**'
      - 'web-app/src/**'
      - 'desktop-app/package.json'
      - 'web-app/package.json'
      - 'desktop-app/electron.js'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  pr-security-and-build:
    name: PR DAST Scan & Bundle Audit
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps --fetch-retries=5

      - name: Run Build
        run: |
          cd desktop-app
          npm run build

      - name: Start Local Web Preview Server
        run: |
          cd desktop-app
          npm run preview -- --port 4173 &
          sleep 5

      - name: OWASP ZAP Baseline DAST Security Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:4173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload Scan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap_report.html
          if-no-files-found: ignore
