name: Tier 2 - Heavy PR Gate & DAST Scan

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'desktop-app/src/**'
      - 'web-app/src/**'
      - 'desktop-app/package.json'
      - 'web-app/package.json'
      - 'desktop-app/electron.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  pr-security-and-build:
    name: PR DAST Scan & Bundle Audit
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps --fetch-retries=5

      - name: Run Build
        run: |
          cd desktop-app
          npm run build

      - name: Start Local Web Preview Server
        run: |
          cd desktop-app
          npm run preview -- --port 4173 &
          sleep 5

      - name: OWASP ZAP Baseline DAST Security Scan
        uses: zaproxy/action-baseline@19199b50b86a760f38b4d1b702ec8c985ecce09f # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:4173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          allow_issue_writing: false
          fail_action: true

      - name: Upload Scan Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html
          if-no-files-found: ignore
