name: Tier 3 - Nightly OWASP ZAP Scan

on:
  schedule:
    # 02:30 AM IST is 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-nightly-scan:
    name: OWASP ZAP Full Scan
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          cd desktop-app
          npm run build

      - name: Start Production Preview
        run: |
          cd desktop-app
          npm run preview -- --port 4173 &
          sleep 5

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:4173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          issue_title: 'Security Alert: OWASP ZAP Discovered Security Defect'
        continue-on-error: true
