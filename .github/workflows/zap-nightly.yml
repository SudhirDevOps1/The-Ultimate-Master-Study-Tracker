name: Tier 3 - Nightly OWASP ZAP Scan

on:
  schedule:
    - cron: '30 6 */2 * *' # Every 2 days at 06:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  zap-nightly-scan:
    name: OWASP ZAP Full Scan
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install Desktop Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          cd desktop-app
          npm run build

      - name: Start Production Preview
        run: |
          cd desktop-app
          npm run preview -- --port 4173 &
          sleep 5

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:4173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report
          path: zap_report.html
          if-no-files-found: ignore
