name: Tier 3 - Nightly OWASP ZAP Scan

on:
  schedule:
    - cron: '30 2 * * 3' # Every Wednesday at 02:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zap-nightly-scan:
    name: OWASP ZAP Full Scan
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install Desktop Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          cd desktop-app
          npm run build

      - name: Start Production Preview
        run: |
          cd desktop-app
          npm run preview -- --port 4173 &
          sleep 5

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@373906d606ca990dd62655c65983bab507527b41 # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:4173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: zap-full-report
          path: report_html.html
          retention-days: 7
          if-no-files-found: ignore
