name: Codecov Coverage & Test Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'desktop-app/**'
      - 'web-app/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'desktop-app/**'
      - 'web-app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  test_and_coverage:
    name: Test Coverage & Codecov Audit
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d247ffcb950032dd0d28e6fc433a5dc1a18c671 # v2.10.4
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps --fetch-retries=5

      - name: Run Desktop App Vitest Coverage
        run: |
          cd desktop-app
          npx vitest run --coverage

      - name: Install Web App Dependencies
        run: |
          cd web-app
          npm install --legacy-peer-deps --fetch-retries=5

      - name: Run Web App Vitest Coverage
        run: |
          cd web-app
          npx vitest run --coverage

      - name: Upload Desktop Coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6b7719022033bc9b4573ca8ac910e66 # v5.3.1
        with:
          files: desktop-app/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Web Coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6b7719022033bc9b4573ca8ac910e66 # v5.3.1
        with:
          files: web-app/coverage/lcov.info
          flags: web
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
