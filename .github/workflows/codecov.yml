name: Codecov Coverage & Test Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  test_and_coverage:
    name: Test Coverage & Codecov Audit
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install Desktop App Dependencies
        run: |
          cd desktop-app
          npm install --legacy-peer-deps --fetch-retries=5

      - name: Run Desktop App Vitest Coverage
        run: |
          cd desktop-app
          npx vitest run --coverage

      - name: Install Web App Dependencies
        run: |
          cd web-app
          npm install --legacy-peer-deps --fetch-retries=5

      - name: Run Web App Vitest Coverage
        run: |
          cd web-app
          npx vitest run --coverage

      - name: Prefix LCOV Paths for Monorepo
        shell: bash
        run: |
          sed -i 's#SF:src#SF:desktop-app/src#' desktop-app/coverage/lcov.info || true
          sed -i 's#SF:src#SF:web-app/src#' web-app/coverage/lcov.info || true

      - name: Upload Desktop Coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: desktop-app/coverage/coverage-final.json,desktop-app/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Web Coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: web-app/coverage/coverage-final.json,web-app/coverage/lcov.info
          flags: web
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
