name: Enterprise Merged Branch Auto-Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0" # Weekly Sunday sweep at 02:00 UTC

concurrency:
  group: branch-cleanup-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-merged-pr-branch:
    name: Auto-Delete Merged PR Branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    steps:
      - name: Purge Head Branch on PR Merge
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            const baseRepo = context.payload.repository.full_name;

            // Only delete branches from the same repository (not forks)
            if (headRepo !== baseRepo) {
              console.log(`Branch ${headRef} belongs to a fork (${headRepo}). Skipping.`);
              return;
            }

            // Invariant: NEVER delete core protected branches or automated release branches
            const protectedBranches = [
              "main",
              "develop",
              "master",
              "gh-pages"
            ];

            if (protectedBranches.includes(headRef) || headRef.startsWith("release-please")) {
              console.log(`Branch ${headRef} is protected. Skipping deletion.`);
              return;
            }

            try {
              console.log(`Deleting merged branch: ${headRef}`);
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`
              });
              console.log(`✅ Successfully deleted merged branch: ${headRef}`);
            } catch (err) {
              if (err.status === 404 || err.status === 422) {
                console.log(`Branch ${headRef} was already deleted or not found.`);
              } else {
                console.warn(`Warning deleting branch ${headRef}:`, err.message);
              }
            }

      - name: Scheduled Stale Merged Branches Sweep
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const protectedBranches = [
              "main",
              "develop",
              "master",
              "gh-pages"
            ];

            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              protected: false,
              per_page: 100
            });

            for (const branch of branches.data) {
              const name = branch.name;
              if (protectedBranches.includes(name) || name.startsWith("release-please") || name.startsWith("dependabot")) {
                continue;
              }

              // Compare branch with develop
              try {
                const cmp = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: "develop",
                  head: name
                });

                // If ahead_by is 0, all commits are already merged into develop
                if (cmp.data.ahead_by === 0) {
                  console.log(`Pruning stale merged branch: ${name}`);
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${name}`
                  });
                  console.log(`✅ Successfully pruned: ${name}`);
                }
              } catch (err) {
                console.warn(`Could not check/prune branch ${name}:`, err.message);
              }
            }
