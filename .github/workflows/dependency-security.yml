name: Tier 3 - Dependency Security Audit

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: NPM Audit Monorepo Scan
    if: github.repository == 'SudhirDevOps1/The-Ultimate-Master-Study-Tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run Monorepo Dependency Security Audit
        run: |
          mkdir -p audit-reports
          echo "=== Starting Strict High-Level Dependency Audit across Monorepo ==="
          for dir in . desktop-app web-app; do
            echo "Auditing package in: $dir"
            (cd "$dir" && npm audit --json > "../audit-reports/${dir//\//_}_audit.json" || true)
            (cd "$dir" && npm audit --audit-level=high)
          done

      - name: Upload Security Audit JSON Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: dependency-audit-reports
          path: audit-reports/
          if-no-files-found: ignore
