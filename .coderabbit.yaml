# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: "You are an elite code reviewer for FlowTrack Pro (React 19 + Electron + TypeScript + Vite). Provide concise, actionable feedback focusing on memory optimization, zero-leak event listeners, TypeScript type-safety, low RAM usage, and performance."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
